services:
  wgdashboard:
    image: ghcr.io/smorad3363/wiredash:__WIREDASH_TAG__
    restart: unless-stopped
    container_name: wgdashboard
    environment:
      wgd_port: "${WGD_PORT:-10086}"
      tz: "${WGD_TZ:-Europe/Istanbul}"
    ports:
      - "${WGD_PANEL_BIND:-0.0.0.0}:${WGD_PORT:-10086}:${WGD_PORT:-10086}/tcp"
      - "51820:51820/udp"
    volumes:
      - aconf:/etc/amnezia/amneziawg
      - conf:/etc/wireguard
      - data:/data
      # Restricted host backup command socket. No Docker/host-root mounts.
      - /run/wgdashbackup-panel:/run/wgdashbackup-panel:ro
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:${WGD_PORT:-10086}/api/handshake >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  aconf:
  conf:
  data:
