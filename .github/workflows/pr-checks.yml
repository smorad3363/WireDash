name: WireDash pull request validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n install.sh deploy/wgdashbackup.sh deploy/wgd-watchdog.sh deploy/legacy/fix-wgdashboard-hang.sh tests/smoke.sh tests/run_synthetic_benchmark.sh
      - name: Python AST test
        run: python3 tests/check_patch.py
      - name: Host backup bridge and panel contract tests
        run: python3 tests/test_backup_panel.py
      - name: Restore milestones and compact SQLite snapshot tests
        run: python3 tests/test_restore_progress_compaction.py
      - name: Keep at most 30 noon backups on VPS; never delete Telegram or pending restores
        run: python3 tests/test_backup_retention_policy.py
      - name: Legacy root backup and multipart import tests
        run: python3 tests/test_backup_import.py
      - name: Telegram first-message link and host-only multipart reader contracts
        run: python3 tests/test_telegram_download.py
      - name: Login-free bot catalog and grouped Telegram backup contract
        run: python3 tests/test_bot_catalog.py
      - name: Catalog-backed Bot API recovery without Telegram user login
        run: python3 tests/test_bot_catalog.py
      - name: Real wireback legacy archive and multipart verifier rehearsal
        run: python3 tests/test_backup_shell_verify.py
      - name: Peer traffic quota tests
        run: python3 tests/test_peer_limits.py
      - name: Polling and peer reuse regression tests
        run: python3 tests/test_performance.py
      - name: Legacy bot API and UI-only paging contract
        run: python3 tests/test_ui_pagination.py
      - name: Persistent WireGuard MTU on GRE installs
        run: python3 tests/test_wireguard_mtu.py
      - name: Peer QR and auth handling regression
        run: node tests/test_peer_qr_auth.mjs
      - name: UI-only peer bulk manager and unchanged API contract
        run: node tests/test_peer_bulk_manager.mjs
      - name: Block bot API contract changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
          git diff --exit-code FETCH_HEAD HEAD -- src/client.py
          python3 tests/test_api_contract_unchanged.py FETCH_HEAD
      - name: Source compatibility for clean installs and upgrades
        run: python3 tests/test_first_setup_contract.py

      - name: ShellCheck
        run: shellcheck -S warning install.sh deploy/wgdashbackup.sh deploy/wgd-watchdog.sh tests/smoke.sh tests/run_synthetic_benchmark.sh
      - name: Compose parse
        run: docker compose -f deploy/compose.yaml config -q
      - name: Installer dry run (read-only)
        run: WIREDASH_SOURCE_SHA=${{ github.event.pull_request.head.sha || github.sha }} bash install.sh --dry-run
      - name: Single-command contract
        run: python3 tests/test_install_contract.py
      - name: Bootstrap without GitHub API
        run: python3 tests/test_bootstrap.py
      - name: Docker image build (no publish)
        run: docker build --file docker/Dockerfile --tag wiredash:pr-check .
      - name: Piecewise factor history and rollback (disposable SQLite)
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            -v "$PWD/tests:/tests:ro" \
            -e PYTHONPATH=/opt/wgdashboard/src \
            -w /opt/wgdashboard/src \
            --entrypoint /opt/wgdashboard/src/venv/bin/python3 wiredash:pr-check \
            /tests/test_traffic_ledger_runtime.py
      - name: Restricted peer bulk deletion (disposable SQLite and mocked WireGuard)
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            -v "$PWD/tests:/tests:ro" \
            -e PYTHONPATH=/opt/wgdashboard/src \
            -w /opt/wgdashboard/src \
            --entrypoint /opt/wgdashboard/src/venv/bin/python3 wiredash:pr-check \
            /tests/test_restricted_deletion_runtime.py
      - name: Live sampling and peer reuse unit tests (in container)
        run: |
          docker run --rm -v "$PWD/tests:/tests:ro" -e PYTHONPATH=/opt/wgdashboard/src -w /opt/wgdashboard/src \
            --entrypoint sh wiredash:pr-check -c \
            '/opt/wgdashboard/src/venv/bin/python3 /tests/test_performance_runtime.py'
      - name: Validate code baked into image
        run: docker run --rm -v "$PWD/tests:/tests:ro" --entrypoint python3 wiredash:pr-check /tests/check_patch.py /opt/wgdashboard/src/modules/PeerShareLinks.py
      - name: Check actual published UI and quota code in image
        run: |
          docker run --rm --entrypoint sh wiredash:pr-check -ec '
            test -f /opt/wgdashboard/src/modules/PeerLimits.py
            grep -Rq "Total upload + download" /opt/wgdashboard/src/static/dist/WGDashboardAdmin/assets
            grep -Rq "Traffic weight" /opt/wgdashboard/src/static/dist/WGDashboardAdmin/assets
            grep -Rq "Validity (days" /opt/wgdashboard/src/static/dist/WGDashboardAdmin/assets
            grep -Rq "Download:" /opt/wgdashboard/src/static/dist/WGDashboardClient/assets
            grep -Rq "Upload:" /opt/wgdashboard/src/static/dist/WGDashboardClient/assets
            grep -Rq "Automatic Backup" /opt/wgdashboard/src/static/dist/WGDashboardAdmin/assets
            grep -Rq "Full restore progress" /opt/wgdashboard/src/static/dist/WGDashboardAdmin/assets
            grep -Rq "No fully cataloged bot backups yet" /opt/wgdashboard/src/static/dist/WGDashboardAdmin/assets
            grep -Rq "Dismiss" /opt/wgdashboard/src/static/dist/WGDashboardAdmin/assets
            grep -Rq "Recover using a Telegram message link" /opt/wgdashboard/src/static/dist/WGDashboardAdmin/assets
            grep -Rq "Could not load the peer configuration for QR" /opt/wgdashboard/src/static/dist/WGDashboardAdmin/assets
            grep -Rq "bulk-data-bar__label" /opt/wgdashboard/src/static/dist/WGDashboardAdmin/assets
            grep -Rq "Expired · Both" /opt/wgdashboard/src/static/dist/WGDashboardAdmin/assets
            grep -Rq "Global traffic factor" /opt/wgdashboard/src/static/dist/WGDashboardAdmin/assets
            grep -Rq "Set traffic factor" /opt/wgdashboard/src/static/dist/WGDashboardAdmin/assets
            grep -Rq "Data used (GB)" /opt/wgdashboard/src/static/dist/WGDashboardAdmin/assets
            grep -Rq "Peer Remote Endpoint — public IP" /opt/wgdashboard/src/static/dist/WGDashboardAdmin/assets
            grep -Rq "Upload, verify" /opt/wgdashboard/src/static/dist/WGDashboardAdmin/assets
          '
      - name: Synthetic 5000 peers under 50 concurrent API clients
        run: |
          # Test-only disposable container. Never attach production volumes or
          # network, expose listening ports, or touch real WireGuard interfaces.
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=192m \
            -v "$PWD/tests:/tests:ro" \
            -e PYTHONPATH=/opt/wgdashboard/src \
            -w /opt/wgdashboard/src \
            --entrypoint /opt/wgdashboard/src/venv/bin/python3 wiredash:pr-check \
            /tests/benchmark_synthetic_api.py --peers 5000 --concurrency 50 --requests 120
      - name: Compare UI-only pagination with unchanged legacy bot API under 5000 peers
        run: |
          # Same sandbox and parameters as legacy test, now returning 50 peers
          # per web request while the historic endpoint remains complete.
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=192m \
            -v "$PWD/tests:/tests:ro" \
            -e PYTHONPATH=/opt/wgdashboard/src \
            -w /opt/wgdashboard/src \
            --entrypoint /opt/wgdashboard/src/venv/bin/python3 wiredash:pr-check \
            /tests/benchmark_synthetic_api.py --peers 5000 --concurrency 50 --requests 120 --mode ui
      - name: Live HTTP smoke on disposable GitHub runner
        run: |
          set -Eeuo pipefail
          # The image stays local to this runner. No registry publish or production access.
          docker tag wiredash:pr-check ghcr.io/smorad3363/wiredash:v1.0.0
          sed 's/__WIREDASH_TAG__/v1.0.0/g' deploy/compose.yaml > /tmp/wiredash-pr-compose.yaml
          cleanup() {
            docker logs --tail 60 wgdashboard || true
            docker compose -f /tmp/wiredash-pr-compose.yaml -p wiredash-pr down || true
          }
          trap cleanup EXIT
          docker compose -f /tmp/wiredash-pr-compose.yaml -p wiredash-pr up -d --no-deps wgdashboard
          ok=0
          for i in $(seq 1 48); do
            if curl -fsS --max-time 5 http://127.0.0.1:10086/api/handshake >/dev/null 2>&1; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          docker_health=0
          for i in $(seq 1 24); do
            if [[ "$(docker inspect -f '{{.State.Health.Status}}' wgdashboard)" == healthy ]]; then docker_health=1; break; fi
            sleep 5
          done
          test "$docker_health" = 1
          docker exec -i wgdashboard python3 - /opt/wgdashboard/src/modules/PeerShareLinks.py < tests/check_patch.py
          # Real WireGuard validation inside the disposable PR container.
          # Its conf is a fresh Docker volume and never contains production keys.
          docker exec wgdashboard sh -ec '
            grep -Eq "^[[:space:]]*MTU[[:space:]]*=[[:space:]]*1280[[:space:]]*$" /etc/wireguard/wg0.conf
            ip -o link show dev wg0 | grep -Eq "[[:space:]]mtu[[:space:]]1280([[:space:]]|$)"
          '
          echo 'PASS: panel responds, Docker health=healthy, wg0 MTU=1280 and in-container patch is present'
