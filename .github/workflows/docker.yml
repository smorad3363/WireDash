name: Build and publish immutable WireDash image

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  docker_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Speed settings editor interactions
        run: node tests/test_speed_editor.mjs
      - name: Verify getLink fix
        run: python3 tests/check_patch.py
      - name: SQLite WAL connection and watchdog regression
        run: python3 tests/test_sqlite_wal_resilience.py
      - name: Live backup config capture with rotating audit logs
        run: python3 tests/test_backup_live_capture.py
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push tag (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/smorad3363/wiredash:sha-${{ github.sha }}
      - name: Account creation order and read-only policy cards
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            -v "$PWD/tests:/tests:ro" \
            -e PYTHONPATH=/opt/wgdashboard/src \
            -w /opt/wgdashboard/src \
            --entrypoint /opt/wgdashboard/src/venv/bin/python3 ghcr.io/smorad3363/wiredash:sha-${{ github.sha }} \
            /tests/test_peer_cards_runtime.py
      - name: Peer addresses, stale file and concurrent renewal regression
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            -v "$PWD/tests:/tests:ro" \
            -e PYTHONPATH=/opt/wgdashboard/src \
            -w /opt/wgdashboard/src \
            --entrypoint /opt/wgdashboard/src/venv/bin/python3 ghcr.io/smorad3363/wiredash:sha-${{ github.sha }} \
            /tests/test_peer_state_runtime.py
      - name: Verify stale peer renew recovery in the built image
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            -v "$PWD/tests:/tests:ro" \
            -e PYTHONPATH=/opt/wgdashboard/src \
            -w /opt/wgdashboard/src \
            --entrypoint /opt/wgdashboard/src/venv/bin/python3 \
            ghcr.io/smorad3363/wiredash:sha-${{ github.sha }} \
            /tests/test_peer_overlap_runtime.py
      - name: Speed policy, persistence, renewal history and private authorization
        run: |
          for test in test_speed_policy test_speed_store test_speed_ui test_speed_history test_speed_scale test_renewal_effective_expiry; do
            docker run --rm --network none --read-only --tmpfs /tmp:rw,size=128m \
              -v "$PWD:/candidate:ro" -w /candidate \
              --entrypoint /opt/wgdashboard/src/venv/bin/python3 \
              ghcr.io/smorad3363/wiredash:sha-${{ github.sha }} /candidate/tests/$test.py
          done
      - name: Encrypted WireGuard speed and interrupted-install recovery
        run: |
          docker run --rm --privileged --network none \
            -e WIREDASH_DISPOSABLE_KERNEL_TEST=1 -v "$PWD:/candidate:ro" \
            --entrypoint /opt/wgdashboard/src/venv/bin/python3 \
            ghcr.io/smorad3363/wiredash:sha-${{ github.sha }} /candidate/tests/test_speed_kernel.py
      # Do not advertise a new version to the installer until its image is
      # published AND regression tests pass on that image.
      - name: Promote latest successfully published commit
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          current=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [[ "$current" != "$RELEASE_SHA" ]]; then
            echo "A newer main commit exists; not promoting old image."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin refs/heads/release-pointer:refs/remotes/origin/release-pointer
          git switch -C release-pointer origin/release-pointer
          printf '%s\n' "$RELEASE_SHA" > release.sha
          git add release.sha
          if git diff --cached --quiet; then
            echo 'Release pointer already matches published image.'
            exit 0
          fi
          git commit -m "release: promote published image ${RELEASE_SHA}"
          git push origin HEAD:refs/heads/release-pointer
